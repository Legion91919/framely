<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  --color-bg:#FAF7F2;--color-surface:#FFFFFF;--color-surface-sunken:#F1ECE4;--color-border:#E3DCD2;
  --color-text:#1E1B18;--color-muted:#5F5850;--color-accent:#A63D24;--color-accent-strong:#8C2F1B;
  --color-accent-soft:#F6E3DC;--color-on-accent:#FFFFFF;--color-ink:#1E1B18;--color-on-ink:#FAF7F2;
  --color-danger:#B3261E;--color-success:#2E7D4F;--color-focus:#1E1B18;
  --font-family:system-ui,sans-serif;--font-display:ui-serif,serif;
  --font-size-xs:12px;--font-size-sm:13px;--font-size-md:15px;--font-size-lg:18px;--font-size-xl:24px;--font-size-xxl:32px;
  --space-xxs:2px;--space-xs:4px;--space-sm:8px;--space-md:16px;--space-lg:24px;--space-xl:40px;--space-xxl:64px;
  --radius-sm:4px;--radius-md:8px;--radius-lg:14px;--radius-pill:999px;
  --shadow-card:0 1px 2px rgba(30,27,24,.06),0 4px 16px rgba(30,27,24,.06);--shadow-dialog:0 12px 48px rgba(30,27,24,.28);
  --feed-max:600px;--rail:300px;--tap:44px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--color-bg);color:var(--color-text);font:var(--font-size-md)/1.5 var(--font-family)}
:focus-visible{outline:3px solid var(--color-focus);outline-offset:2px}
button{font:inherit;cursor:pointer}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mark{display:inline-flex;align-items:center;gap:var(--space-sm);font-family:var(--font-display);font-size:var(--font-size-xl);letter-spacing:-.01em;text-decoration:none;color:inherit}
.btn{min-height:var(--tap);padding:0 var(--space-md);border-radius:var(--radius-pill);border:1px solid var(--color-border);background:var(--color-surface);color:var(--color-text);font-weight:500}
.btn-primary{background:var(--color-accent);border-color:var(--color-accent);color:var(--color-on-accent)}
.btn-primary:hover{background:var(--color-accent-strong)}
.btn-following{background:var(--color-accent-soft);border-color:var(--color-accent-soft);color:var(--color-accent-strong)}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--color-surface-sunken);color:var(--color-text);font-weight:700;font-size:var(--font-size-sm);flex:none}
.muted{color:var(--color-muted)}
</style>
<script>
/* Placeholder photo: a generated SVG landscape (no external images). */
function art(seed,w,h){w=w||800;h=h||1000;
 var P=[["#F4B88A","#F7E2C6","#FFF3DA","#7A5C61","#3E3440"],["#8EC5D6","#DDEFF2","#FFFFFF","#5D8C7B","#2F4F4A"],["#2B2F4E","#6A5D86","#F3D9A4","#3A3552","#1B1C2E"],["#E9C46A","#F4E3B5","#FFFBEA","#B5835A","#6B4E3D"],["#C9D6DF","#EEF2F4","#FAFAFA","#8A9BA8","#4A5A66"],["#F28F79","#FBD1A2","#FFF1D6","#9C4F5C","#4B2C3A"]];
 var p=P[seed%P.length],r=function(n){return((seed*9301+49297*n)%233280)/233280};
 var sx=Math.round(w*(0.2+0.6*r(1))),sy=Math.round(h*(0.22+0.2*r(2))),y1=Math.round(h*(0.55+0.1*r(3))),y2=Math.round(h*(0.72+0.1*r(4)));
 var s="<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 "+w+" "+h+"'><defs><linearGradient id='s' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='"+p[0]+"'/><stop offset='1' stop-color='"+p[1]+"'/></linearGradient></defs><rect width='"+w+"' height='"+h+"' fill='url(#s)'/><circle cx='"+sx+"' cy='"+sy+"' r='"+Math.round(w*0.09)+"' fill='"+p[2]+"'/><path d='M0 "+y1+" L"+Math.round(w*0.3)+" "+Math.round(y1-h*0.12)+" L"+Math.round(w*0.55)+" "+Math.round(y1-h*0.03)+" L"+Math.round(w*0.8)+" "+Math.round(y1-h*0.15)+" L"+w+" "+Math.round(y1-h*0.05)+" V"+h+" H0Z' fill='"+p[3]+"'/><path d='M0 "+y2+" Q"+Math.round(w*0.4)+" "+Math.round(y2-h*0.1)+" "+w+" "+Math.round(y2+h*0.02)+" V"+h+" H0Z' fill='"+p[4]+"'/></svg>";
 return "data:image/svg+xml,"+encodeURIComponent(s);}
var LOGO='<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><path d="M3 9V3h6M19 3h6v6M25 19v6h-6M9 25H3v-6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><circle cx="14" cy="14" r="4" fill="#A63D24"/></svg>';
var POSTS=[
 {id:1,name:"Naledi Dube",handle:"naledi.frames",city:"Bo-Kaap, Cape Town",ago:"4 min",w:800,h:1000,cap:"First light on Wale Street. The houses wake up one colour at a time.",alt:"Pastel houses on a sloping street at dawn"},
 {id:2,name:"Pieter van Wyk",handle:"karoo.pieter",city:"Prince Albert",ago:"38 min",w:1200,h:800,cap:"Twenty minutes of nothing, then this. Karoo patience pays.",alt:"Wide dry plain under a pale sun"},
 {id:3,name:"Ayesha Patel",handle:"ayesha.p",city:"Durban",ago:"1 h",w:800,h:800,cap:"Fishermen on the pier before the surfers arrive.",alt:"Silhouettes on a pier at sunrise"},
 {id:4,name:"Sipho Ndlovu",handle:"sipho.sees",city:"Soweto",ago:"2 h",w:800,h:1000,cap:"Vilakazi Street, Saturday rhythm. Shot on a 35mm prime, nothing else.",alt:"Busy street with long evening shadows"},
 {id:5,name:"Lerato Khumalo",handle:"lerato.light",city:"Drakensberg",ago:"5 h",w:1200,h:800,cap:"Amphitheatre in cloud. Waited for the gap.",alt:"Mountain wall half hidden by cloud"},
 {id:6,name:"Mia Botha",handle:"mia.analog",city:"Knysna",ago:"Yesterday",w:800,h:1000,cap:"Lagoon at slack tide, colours straight out of camera.",alt:"Still lagoon reflecting hills"},
 {id:7,name:"Jonah Februarie",handle:"jonah.f",city:"Paternoster",ago:"Yesterday",w:800,h:800,cap:"White walls, blue doors, one cat who refused to move.",alt:"Whitewashed cottage with blue door"},
 {id:8,name:"Zanele Mthembu",handle:"zanele.m",city:"Makhanda",ago:"2 d",w:1200,h:800,cap:"Festival week, the quiet hour after.",alt:"Empty festival street at dusk"}
];
function initials(n){return n.split(" ").map(function(x){return x[0]}).join("").slice(0,2)}
</script>
<title>Framely home feed, variant C: catch-up queue</title>
<style>
.top{display:flex;align-items:center;gap:var(--space-md);padding:var(--space-sm) var(--space-lg);border-bottom:1px solid var(--color-border)}
.top .spacer{flex:1}
.layout{display:grid;grid-template-columns:340px minmax(0,1fr);min-height:calc(100vh - 61px)}
.compose{border-right:1px solid var(--color-border);background:var(--color-surface);padding:var(--space-lg)}
.compose h2{font-family:var(--font-display);font-weight:400;font-size:var(--font-size-xl);margin:0 0 var(--space-md)}
.compose ol{list-style:none;padding:0;margin:0 0 var(--space-lg);counter-reset:s}
.compose li{counter-increment:s;display:flex;gap:var(--space-sm);align-items:center;padding:var(--space-sm) 0;color:var(--color-muted)}
.compose li::before{content:counter(s);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--color-border);font-weight:700}
.compose li[aria-current]{color:var(--color-text);font-weight:700}
.compose li[aria-current]::before{background:var(--color-accent);border-color:var(--color-accent);color:var(--color-on-accent)}
.drop{border:2px dashed var(--color-border);border-radius:var(--radius-lg);padding:var(--space-xl) var(--space-md);text-align:center;background:var(--color-surface-sunken)}
.drop small{display:block;color:var(--color-muted);margin-top:var(--space-sm)}
.queue{padding:var(--space-lg);display:flex;flex-direction:column;align-items:center}
.status{width:100%;max-width:720px;display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-md)}
.status h1{font-size:var(--font-size-lg);margin:0}
progress{width:160px;accent-color:var(--color-accent)}
.stage{width:100%;max-width:720px;background:var(--color-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);overflow:hidden}
.stage img{display:block;width:100%;max-height:62vh;object-fit:contain;background:var(--color-ink)}
.stage .info{display:flex;gap:var(--space-sm);align-items:flex-start;padding:var(--space-md)}
.stage .info p{margin:var(--space-xs) 0 0}
.nav{display:flex;gap:var(--space-sm);margin:var(--space-md) 0}
.strip{display:flex;gap:var(--space-sm);overflow-x:auto;max-width:720px;width:100%;padding-bottom:var(--space-sm)}
.strip button{all:unset;cursor:pointer;flex:none;border-radius:var(--radius-sm);outline-offset:2px}
.strip button[aria-current]{outline:3px solid var(--color-accent)}
.strip img{display:block;width:72px;height:72px;object-fit:cover;border-radius:var(--radius-sm)}
@media (max-width:900px){.layout{grid-template-columns:1fr}.compose{display:none}.queue{padding:var(--space-md)}}
</style>
</head><body>
<header class="top"><a class="mark" href="#" aria-label="Framely home"><span id="logo"></span>framely</a><span class="spacer"></span><button class="btn">Members</button></header>
<div class="layout">
  <section class="compose" aria-labelledby="ch">
    <h2 id="ch">Share today's frame</h2>
    <ol><li aria-current="step">Choose a photo</li><li>Write a caption</li><li>Post to 214 followers</li></ol>
    <div class="drop"><button class="btn btn-primary">Choose a JPEG</button><small>Up to 10 MB. Location data is removed unless you turn on location sharing.</small></div>
  </section>
  <main class="queue" aria-label="New from people you follow">
    <div class="status"><h1 id="st">Frame 1 of 8 new</h1><progress id="pg" max="8" value="1" aria-label="Catch-up progress"></progress></div>
    <article class="stage" aria-live="polite"><img id="big" alt=""><div class="info"><span class="avatar" id="av" aria-hidden="true"></span><div><b id="nm"></b> <span class="muted" id="hd"></span><p id="cp"></p></div></div></article>
    <div class="nav"><button class="btn" id="prev">Previous <span class="muted">(K)</span></button><button class="btn btn-primary" id="next">Next <span>(J)</span></button></div>
    <div class="strip" id="strip" aria-label="Queue"></div>
  </main>
</div>
<script>
document.getElementById("logo").innerHTML=LOGO;var i=0;
function show(n){i=Math.max(0,Math.min(POSTS.length-1,n));var p=POSTS[i];var b=document.getElementById("big");b.src=art(p.id,p.w,p.h);b.alt=p.alt;
 document.getElementById("av").textContent=initials(p.name);document.getElementById("nm").textContent=p.name;document.getElementById("hd").textContent="@"+p.handle+" · "+p.ago+" ago";document.getElementById("cp").textContent=p.cap;
 document.getElementById("st").textContent=i===POSTS.length-1?"You're caught up":"Frame "+(i+1)+" of "+POSTS.length+" new";document.getElementById("pg").value=i+1;
 [].forEach.call(document.querySelectorAll(".strip button"),function(x,k){if(k===i)x.setAttribute("aria-current","true");else x.removeAttribute("aria-current")});}
document.getElementById("strip").innerHTML=POSTS.map(function(p,k){return '<button aria-label="Frame '+(k+1)+' by '+p.name+'"><img alt="" src="'+art(p.id,200,200)+'"></button>'}).join("");
[].forEach.call(document.querySelectorAll(".strip button"),function(x,k){x.onclick=function(){show(k)}});
document.getElementById("next").onclick=function(){show(i+1)};document.getElementById("prev").onclick=function(){show(i-1)};
document.addEventListener("keydown",function(e){if(e.key==="j")show(i+1);if(e.key==="k")show(i-1)});show(0);
</script>
</body></html>
