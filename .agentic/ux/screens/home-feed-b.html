<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  --color-bg:#FAF7F2;--color-surface:#FFFFFF;--color-surface-sunken:#F1ECE4;--color-border:#E3DCD2;
  --color-text:#1E1B18;--color-muted:#5F5850;--color-accent:#A63D24;--color-accent-strong:#8C2F1B;
  --color-accent-soft:#F6E3DC;--color-on-accent:#FFFFFF;--color-ink:#1E1B18;--color-on-ink:#FAF7F2;
  --color-danger:#B3261E;--color-success:#2E7D4F;--color-focus:#1E1B18;
  --font-family:system-ui,sans-serif;--font-display:ui-serif,serif;
  --font-size-xs:12px;--font-size-sm:13px;--font-size-md:15px;--font-size-lg:18px;--font-size-xl:24px;--font-size-xxl:32px;
  --space-xxs:2px;--space-xs:4px;--space-sm:8px;--space-md:16px;--space-lg:24px;--space-xl:40px;--space-xxl:64px;
  --radius-sm:4px;--radius-md:8px;--radius-lg:14px;--radius-pill:999px;
  --shadow-card:0 1px 2px rgba(30,27,24,.06),0 4px 16px rgba(30,27,24,.06);--shadow-dialog:0 12px 48px rgba(30,27,24,.28);
  --feed-max:600px;--rail:300px;--tap:44px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--color-bg);color:var(--color-text);font:var(--font-size-md)/1.5 var(--font-family)}
:focus-visible{outline:3px solid var(--color-focus);outline-offset:2px}
button{font:inherit;cursor:pointer}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mark{display:inline-flex;align-items:center;gap:var(--space-sm);font-family:var(--font-display);font-size:var(--font-size-xl);letter-spacing:-.01em;text-decoration:none;color:inherit}
.btn{min-height:var(--tap);padding:0 var(--space-md);border-radius:var(--radius-pill);border:1px solid var(--color-border);background:var(--color-surface);color:var(--color-text);font-weight:500}
.btn-primary{background:var(--color-accent);border-color:var(--color-accent);color:var(--color-on-accent)}
.btn-primary:hover{background:var(--color-accent-strong)}
.btn-following{background:var(--color-accent-soft);border-color:var(--color-accent-soft);color:var(--color-accent-strong)}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--color-surface-sunken);color:var(--color-text);font-weight:700;font-size:var(--font-size-sm);flex:none}
.muted{color:var(--color-muted)}
</style>
<script>
/* Placeholder photo: a generated SVG landscape (no external images). */
function art(seed,w,h){w=w||800;h=h||1000;
 var P=[["#F4B88A","#F7E2C6","#FFF3DA","#7A5C61","#3E3440"],["#8EC5D6","#DDEFF2","#FFFFFF","#5D8C7B","#2F4F4A"],["#2B2F4E","#6A5D86","#F3D9A4","#3A3552","#1B1C2E"],["#E9C46A","#F4E3B5","#FFFBEA","#B5835A","#6B4E3D"],["#C9D6DF","#EEF2F4","#FAFAFA","#8A9BA8","#4A5A66"],["#F28F79","#FBD1A2","#FFF1D6","#9C4F5C","#4B2C3A"]];
 var p=P[seed%P.length],r=function(n){return((seed*9301+49297*n)%233280)/233280};
 var sx=Math.round(w*(0.2+0.6*r(1))),sy=Math.round(h*(0.22+0.2*r(2))),y1=Math.round(h*(0.55+0.1*r(3))),y2=Math.round(h*(0.72+0.1*r(4)));
 var s="<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 "+w+" "+h+"'><defs><linearGradient id='s' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='"+p[0]+"'/><stop offset='1' stop-color='"+p[1]+"'/></linearGradient></defs><rect width='"+w+"' height='"+h+"' fill='url(#s)'/><circle cx='"+sx+"' cy='"+sy+"' r='"+Math.round(w*0.09)+"' fill='"+p[2]+"'/><path d='M0 "+y1+" L"+Math.round(w*0.3)+" "+Math.round(y1-h*0.12)+" L"+Math.round(w*0.55)+" "+Math.round(y1-h*0.03)+" L"+Math.round(w*0.8)+" "+Math.round(y1-h*0.15)+" L"+w+" "+Math.round(y1-h*0.05)+" V"+h+" H0Z' fill='"+p[3]+"'/><path d='M0 "+y2+" Q"+Math.round(w*0.4)+" "+Math.round(y2-h*0.1)+" "+w+" "+Math.round(y2+h*0.02)+" V"+h+" H0Z' fill='"+p[4]+"'/></svg>";
 return "data:image/svg+xml,"+encodeURIComponent(s);}
var LOGO='<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><path d="M3 9V3h6M19 3h6v6M25 19v6h-6M9 25H3v-6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><circle cx="14" cy="14" r="4" fill="#A63D24"/></svg>';
var POSTS=[
 {id:1,name:"Naledi Dube",handle:"naledi.frames",city:"Bo-Kaap, Cape Town",ago:"4 min",w:800,h:1000,cap:"First light on Wale Street. The houses wake up one colour at a time.",alt:"Pastel houses on a sloping street at dawn"},
 {id:2,name:"Pieter van Wyk",handle:"karoo.pieter",city:"Prince Albert",ago:"38 min",w:1200,h:800,cap:"Twenty minutes of nothing, then this. Karoo patience pays.",alt:"Wide dry plain under a pale sun"},
 {id:3,name:"Ayesha Patel",handle:"ayesha.p",city:"Durban",ago:"1 h",w:800,h:800,cap:"Fishermen on the pier before the surfers arrive.",alt:"Silhouettes on a pier at sunrise"},
 {id:4,name:"Sipho Ndlovu",handle:"sipho.sees",city:"Soweto",ago:"2 h",w:800,h:1000,cap:"Vilakazi Street, Saturday rhythm. Shot on a 35mm prime, nothing else.",alt:"Busy street with long evening shadows"},
 {id:5,name:"Lerato Khumalo",handle:"lerato.light",city:"Drakensberg",ago:"5 h",w:1200,h:800,cap:"Amphitheatre in cloud. Waited for the gap.",alt:"Mountain wall half hidden by cloud"},
 {id:6,name:"Mia Botha",handle:"mia.analog",city:"Knysna",ago:"Yesterday",w:800,h:1000,cap:"Lagoon at slack tide, colours straight out of camera.",alt:"Still lagoon reflecting hills"},
 {id:7,name:"Jonah Februarie",handle:"jonah.f",city:"Paternoster",ago:"Yesterday",w:800,h:800,cap:"White walls, blue doors, one cat who refused to move.",alt:"Whitewashed cottage with blue door"},
 {id:8,name:"Zanele Mthembu",handle:"zanele.m",city:"Makhanda",ago:"2 d",w:1200,h:800,cap:"Festival week, the quiet hour after.",alt:"Empty festival street at dusk"}
];
function initials(n){return n.split(" ").map(function(x){return x[0]}).join("").slice(0,2)}
</script>
<title>Framely home feed, variant B: gallery wall</title>
<style>
.top{position:sticky;top:0;z-index:2;background:var(--color-bg);border-bottom:1px solid var(--color-border);display:flex;align-items:center;padding:var(--space-sm) var(--space-lg)}
.top .spacer{flex:1}
.wrap{display:grid;grid-template-columns:minmax(0,var(--feed-max)) var(--rail);gap:var(--space-xl);justify-content:center;padding:var(--space-lg)}
.prompt{display:flex;align-items:center;gap:var(--space-md);background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-md);margin-bottom:var(--space-lg)}
.prompt button.fake{flex:1;text-align:left;min-height:var(--tap);border:1px dashed var(--color-border);background:var(--color-surface-sunken);color:var(--color-muted);border-radius:var(--radius-pill);padding:0 var(--space-md)}
.card{background:var(--color-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);margin:0 0 var(--space-lg);overflow:hidden}
.card header{display:flex;align-items:center;gap:var(--space-sm);padding:var(--space-md)}
.card header .who{flex:1;min-width:0;line-height:1.25}
.card header .who b{display:block}
.card header .who span{font-size:var(--font-size-sm)}
.card img{display:block;width:100%;height:auto;background:var(--color-surface-sunken)}
.card p{margin:0;padding:var(--space-md)}
.card time{display:block;padding:0 var(--space-md) var(--space-md);font-size:var(--font-size-xs);color:var(--color-muted)}
aside h2{font-size:var(--font-size-md);margin:0 0 var(--space-md)}
aside ul{list-style:none;margin:0;padding:0}
aside li{display:flex;align-items:center;gap:var(--space-sm);padding:var(--space-sm) 0}
aside li .who{flex:1;line-height:1.25;font-size:var(--font-size-sm)}
.panel{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-md);position:sticky;top:80px}
.fab{display:none}
@media (max-width:900px){.wrap{grid-template-columns:minmax(0,1fr);padding:0}.wrap aside,.prompt{display:none}.card{border-radius:0;box-shadow:none;border-bottom:1px solid var(--color-border);margin:0}
 .fab{display:grid;place-items:center;position:fixed;right:var(--space-md);bottom:var(--space-md);width:56px;height:56px;border-radius:50%;border:0;background:var(--color-accent);color:var(--color-on-accent);font-size:28px;box-shadow:var(--shadow-dialog)}}
</style>
</head><body>
<header class="top"><a class="mark" href="#" aria-label="Framely home"><span id="logo"></span>framely</a><span class="spacer"></span><span class="avatar" aria-label="Signed in as Thandi Mahlangu">TM</span></header>
<div class="wrap">
  <main aria-label="Home feed, newest first">
    <div class="prompt"><span class="avatar" aria-hidden="true">TM</span><button class="fake">Share a frame with your 214 followers…</button><button class="btn btn-primary">Post a photo</button></div>
    <div id="feed"></div>
  </main>
  <aside aria-label="Photographers to follow"><div class="panel"><h2>Photographers near you</h2><ul id="suggest"></ul></div></aside>
</div>
<button class="fab" aria-label="Post a photo">+</button>
<script>
document.getElementById("logo").innerHTML=LOGO;
document.getElementById("feed").innerHTML=POSTS.map(function(p){return '<article class="card" aria-labelledby="a'+p.id+'"><header><span class="avatar" aria-hidden="true">'+initials(p.name)+'</span><span class="who"><b id="a'+p.id+'">'+p.name+'</b><span class="muted">@'+p.handle+' · '+p.city+'</span></span></header><img alt="'+p.alt+'" width="'+p.w+'" height="'+p.h+'" src="'+art(p.id,p.w,p.h)+'"><p>'+p.cap+'</p><time>'+p.ago+' ago</time></article>'}).join("");
var S=[["Kagiso Sello","kagiso.street","Pretoria",false],["Fatima Abrahams","fatima.film","Stellenbosch",false],["Ruan Pretorius","ruan.wild","Kruger edge",true]];
document.getElementById("suggest").innerHTML=S.map(function(s){return '<li><span class="avatar" aria-hidden="true">'+initials(s[0])+'</span><span class="who"><b>'+s[0]+'</b><br><span class="muted">@'+s[1]+' · '+s[2]+'</span></span><button class="btn '+(s[3]?'btn-following':'')+'" aria-pressed="'+s[3]+'">'+(s[3]?'Following':'Follow')+'</button></li>'}).join("");
</script>
</body></html>
